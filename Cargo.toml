[workspace]
resolver = "2"
members = [
    "abar-api",
    "abar-core",
    "abar-cli",
    "adapters/abar-model-fake",
    "adapters/abar-model-openai",
    "adapters/abar-auth-oidc",
    "adapters/abar-channel-dingtalk",
    "adapters/abar-tool-fake",
    "adapters/abar-tool-mcp-http",
    "examples/merchandise-operations/mock-mcp-server",
    "examples/merchandise-operations/model-provider",
    "apps/abar-webui",
    "apps/abar-platform-console",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
abar-api = { path = "abar-api" }
abar-core = { path = "abar-core" }
axum = "0.8"
base64 = "0.22"
fs2 = "0.4"
futures-util = "0.3"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
